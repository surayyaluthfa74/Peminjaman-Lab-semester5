<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      {% if edit %} Edit Barang {% else %} Tambah Barang {% endif %}
    </title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="card shadow-sm">
        <div class="card-body">
          {% if edit %}
          <h3 class="mb-4">Edit Barang</h3>
          {% else %}
          <h3 class="mb-4">Tambah Barang</h3>
          {% endif %}

          <form method="POST">
            <!-- Nama Barang -->
            <div class="mb-3">
              <label class="form-label"> Nama Barang </label>

              <input
                type="text"
                name="nama_barang"
                class="form-control"
                placeholder="Contoh: Laptop"
                {%
                if
                edit
                %}
                value="{{ barang.nama_barang }}"
                {%
                endif
                %}
                required
              />
            </div>

            <!-- Kategori -->
            <div class="mb-3">
              <label class="form-label"> Kategori </label>

              <input
                type="text"
                name="kategori"
                class="form-control"
                placeholder="Contoh: Elektronik"
                {%
                if
                edit
                %}
                value="{{ barang.kategori }}"
                {%
                endif
                %}
                required
              />
            </div>

            <!-- Stok -->
            <div class="mb-3">
              <label class="form-label"> Stok </label>

              <input
                type="number"
                name="stok"
                class="form-control"
                min="0"
                placeholder="Masukkan jumlah stok"
                {%
                if
                edit
                %}
                value="{{ barang.stok }}"
                {%
                endif
                %}
                required
              />
            </div>

            <!-- Kondisi -->
            <div class="mb-4">
              <label class="form-label"> Kondisi </label>

              <select name="kondisi" class="form-select" required>
                <option value="">Pilih kondisi</option>

                {% if edit and barang.kondisi == "Baik" %}
                <option value="Baik" selected>Baik</option>
                {% else %}
                <option value="Baik">Baik</option>
                {% endif %} {% if edit and barang.kondisi == "Rusak Ringan" %}
                <option value="Rusak Ringan" selected>Rusak Ringan</option>
                {% else %}
                <option value="Rusak Ringan">Rusak Ringan</option>
                {% endif %} {% if edit and barang.kondisi == "Rusak Berat" %}
                <option value="Rusak Berat" selected>Rusak Berat</option>
                {% else %}
                <option value="Rusak Berat">Rusak Berat</option>
                {% endif %}
              </select>
            </div>

            <!-- Tombol -->
            <button type="submit" class="btn btn-primary">Simpan</button>

            <a href="{{ url_for('barang') }}" class="btn btn-secondary">
              Kembali
            </a>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
